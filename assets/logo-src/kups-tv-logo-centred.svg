<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <!-- White Background -->
  <rect width="512" height="512" fill="#FFFFFF" />

  <!-- Centred: the drawing below was centred on x = 352, so it is moved 96 left. -->
  <g transform="translate(-96 0)">

  <!-- TV Screen -->
  <rect
    x="135"
    y="98"
    width="434"
    height="279"
    rx="58"
    fill="#EA580C"
  />

  <!-- Centered Play Button -->
  <path
    d="M 334 173
       L 393 207
       Q 407 216 393 225
       L 334 260
       Q 317 270 317 251
       L 317 182
       Q 317 163 334 173 Z"
    fill="#FFFFFF"
  />

  <!-- KUPS Wordmark (Reduced by 50%) -->
  <text
    x="384"
    y="317"
    font-family="'Arial Rounded MT Bold', 'Varela Round', 'Quicksand', sans-serif"
    font-size="30"
    font-weight="900"
    letter-spacing="8"
    text-anchor="middle"
    fill="#FFFFFF"
  >KUPS</text>

  <!-- TV Stand -->
  <path
    d="M 287 386
       L 417 386
       L 440 411
       Q 446 420 435 420
       L 268 420
       Q 257 420 264 411 Z"
    fill="#EA580C"
  />
  </g>
</svg>
